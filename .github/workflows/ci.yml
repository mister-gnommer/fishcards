name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: `npm ci` runs third-party install scripts, which must not be able to push.
permissions:
  contents: read

# Per branch/PR: a new PR push cancels its outdated run; pushes to main queue so deploys never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Local auth config for `preview`: dummy OAuth ids and a throwaway secret that never leaves the runner.
      - run: sed "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .dev.vars.example > .dev.vars
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer applies local D1 migrations, then starts `preview`.
      - run: npm run test:e2e
      # Only a push to main (a merged PR) touches production.
      - if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Deploys the build the e2e tests just ran against (preview builds into .open-next/).
      - if: github.event_name == 'push'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
