schema: spec-driven

context: |
  Next.js (App Router) on Cloudflare Workers via OpenNext; D1 + Drizzle; Better Auth (Google, GitHub);
  next-intl with locale in the URL (en, pl); Tailwind + shadcn/ui; npm with exact versions.
  No open sign-up: only emails in the ALLOWED_EMAILS secret can sign in.
  Production only, at fishcards.gnommer.pl; GitHub Actions on main runs tests, D1 migrations, deploy.
  Every user-facing string goes through i18n, with both en and pl.
  The owner reviews auth and security code personally: keep it small and isolated from feature code.

rules:
  proposal:
    - State what is out of scope.
