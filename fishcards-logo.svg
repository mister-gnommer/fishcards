    <linearGradient id="ivory" x1="150" y1="380" x2="884" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#f5f2ec"/><stop offset="1" stop-color="#f0ede7"/></linearGradient>
    <linearGradient id="teal" x1="730" y1="456" x2="790" y2="516" gradientUnits="userSpaceOnUse"><stop stop-color="#31aa9f"/><stop offset="1" stop-color="#2ca99d"/></linearGradient>
