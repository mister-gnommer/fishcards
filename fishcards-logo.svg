    <path fill="url(#ivory)" d="M640 388C756 388 840 440 890 502Q898 512 890 522C840 584 756 636 640 636C628 636 622 626 628 616Q664 568 664 512Q664 456 628 408C622 398 628 388 640 388Z"/>
